<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-label="Perkins Creative Digital Agency">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1E2B4"/>
      <stop offset="38%" stop-color="#C9A24B"/>
      <stop offset="72%" stop-color="#A37F30"/>
      <stop offset="100%" stop-color="#7E5F22"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6EAC2"/>
      <stop offset="100%" stop-color="#9A7B2E"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#191B20"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </radialGradient>
  </defs>

  <rect width="600" height="760" fill="url(#bg)"/>

  <!-- Faceted diamond emblem -->
  <g transform="translate(300 232)">
    <!-- outer gem -->
    <polygon points="0,-150 130,-46 78,150 -78,150 -130,-46"
             fill="none" stroke="url(#goldEdge)" stroke-width="6" stroke-linejoin="round"/>
    <!-- table line -->
    <polygon points="-78,-46 78,-46 130,-46 -130,-46" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.85"/>
    <line x1="-78" y1="-46" x2="0" y2="-150" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
    <line x1="78" y1="-46" x2="0" y2="-150" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
    <!-- pavilion facets -->
    <line x1="-130" y1="-46" x2="0" y2="150" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
    <line x1="130" y1="-46" x2="0" y2="150" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
    <line x1="-78" y1="-46" x2="0" y2="150" stroke="url(#gold)" stroke-width="2.4" opacity="0.45"/>
    <line x1="78" y1="-46" x2="0" y2="150" stroke="url(#gold)" stroke-width="2.4" opacity="0.45"/>
    <line x1="0" y1="-46" x2="0" y2="-150" stroke="url(#gold)" stroke-width="2.4" opacity="0.4"/>
    <!-- Serif P monogram -->
    <text x="0" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="150" font-weight="700" fill="url(#gold)">P</text>
  </g>

  <!-- Wordmark -->
  <text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="92" letter-spacing="14" fill="url(#gold)">PERKINS</text>
  <!-- Divider -->
  <line x1="150" y1="540" x2="450" y2="540" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <!-- Sub-line -->
  <text x="300" y="582" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-size="22" letter-spacing="11" fill="#E8D6A6">CREATIVE DIGITAL AGENCY</text>
  <!-- Tagline -->
  <text x="300" y="648" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-size="20" letter-spacing="6" fill="#9A9CA3" font-style="italic">Elevate Everything</text>
</svg>
